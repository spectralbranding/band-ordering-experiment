      created_at: "2026-08-30"
      under_conditions: "sample count held fixed across bands to keep band separate from estimator bias"
    body_sections: ["Method - The two arms"]
  - id: M2
    statement: "Horizon sweep at two sample budgets, excluding cells that cannot feed the basis."
    type: "simulation"
    inputs: [O3]
