spine_version: "0.2"
paper_key: "2026bq"
title: "Rank Order Under a Capacity Benchmark Is Conditional on the Observation Band and the Delay Horizon"

thesis: |
  A rank ordering of computational systems under a capacity benchmark holds only at the observation
  band and delay horizon at which it was taken, and neither condition is usually reported. Under a
  readout-only band change the ordering's memory component collapses while its separation component
  is untouched; under a drive-band change the ordering reverses outright in every seed, in two
  architecture families, at a crossover band that moves with the delay horizon. The systems compared
  differ only in their time constant, so this is a demonstration of an effect the field's own algebra
  predicts, not a discovery. The contribution is the measurement on a common grid and the reporting
  condition it licenses.

boundary_conditions:
  - id: C1
    statement: "Simulation only. Two architecture families of parameterised variants carry every ordering claim; the one physical system in the study is excluded from all of them."
  - id: C2
    statement: "One capacity estimator with a degree-2 polynomial basis, held fixed throughout."
  - id: C3
    statement: "Rank measures computed under the ensemble protocol: distinct input streams, one state each, taken at the end of the stream."
  - id: C4
    statement: "The drive band is coarsened by zero-order hold, which is the standard construction but is one choice."
  - id: C5
    statement: "The drive is independent and identically distributed, which the capacity basis requires."

assumption_atoms:
  - id: AA1
    statement: "The capacity basis is well posed only on an i.i.d. drive; decimating an i.i.d. series leaves it i.i.d., so a readout-only manipulation does not disturb the basis."
    provenance:
      created_by: "author"
      created_at: "2026-08-30"
      under_conditions: "design constraint fixed by a feasibility spike before any measurement"
  - id: AA2
    statement: "A fair comparison across systems requires a sample count above every system's saturation point; equal budget is not equal adequacy."
    provenance:
      created_by: "author"
      created_at: "2026-08-30"
      under_conditions: "established by the saturation control"
  - id: AA3
    statement: "Step size and leaking rate are not independent parameters: discretisation condenses them into a compound gain, so the leaking rate enters the update only as their product."
    provenance:
      created_by: "author"
      created_at: "2026-08-31"
      under_conditions: "read from the publisher PDF, not from an abstract"

