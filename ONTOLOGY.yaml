# ONTOLOGY.yaml module - 2026bq (band-conditionality of a capacity ranking)
#
# Per-paper ontology module per SPINE_FIRST_DRAFTING_PROTOCOL.md
# §"ONTOLOGY.yaml schema (v0.1)". owns = terms THIS paper introduces (unique
# authority); imports = terms owned by other modules it uses.
#
# 2026bq is a methodological note about reservoir-computing benchmarking. It
# deliberately carries NO brand-measurement vocabulary -- the audience is another
# field, and importing corpus jargon would make the note unreadable to it. The
# imports list is therefore empty by design, not by omission.
#
# The terms below name a distinction the note had to draw before it could state
# its result: that "changing the sampling rate" is two different manipulations
# with different consequences, and that the conditionality attaches to some
# behaviour-space axes and not others.

paper_key: 2026bq
schema_version: 0.1

owns:
  - term_key: observation-band
    label: "Observation band"
    canonical_form: "observation band"
    definition: >-
      The pair of intervals at which a dynamical system used as a computational reservoir is driven
      and read: the drive interval at which input is presented, and the readout interval at which
      state is recorded. Named as a pair because the two are separable manipulations that a single
      "sampling rate" conflates, and because a comparative claim is conditional on both.
    first_section: "Abstract; Method - The two arms"

  - term_key: drive-band
    label: "Drive band"
    canonical_form: "drive band"
    definition: >-
      The interval at which input is presented to a reservoir. Changing it changes the system's
      dynamics, and therefore reaches every axis of a behaviour-space characterisation. It cannot be
      changed after the fact: an archived recording cannot be re-driven.
    first_section: "Method - The two arms"
    relations:
      - {type: specializes, term_key: observation-band, note: "one of the two intervals the band comprises"}

  - term_key: readout-band
    label: "Readout band"
    canonical_form: "readout band"
    definition: >-
      The interval at which reservoir state is recorded while the drive is left at its native rate.
      It is the only band manipulation available to a re-analyst of an archived recording, and it is
      weaker than a drive change: it costs capacity without necessarily changing rank order.
    first_section: "Method - The two arms"
    relations:
      - {type: specializes, term_key: observation-band, note: "the other of the two intervals"}
      - {type: contrasts, term_key: drive-band, note: "the two give opposite answers about rank order, which is why decimating an archive is not a proxy for a band change"}

  - term_key: band-conditionality
    label: "Band conditionality"
    canonical_form: "band conditionality"
    definition: >-
      The property that a rank ordering of systems under a capacity benchmark holds only at the
      observation band and delay horizon at which it was measured. A published ranking that reports
      neither is a statement whose conditions are unrecoverable, which is a comparability failure
      rather than a failure of physics.
    first_section: "Abstract; Discussion - What is demonstrated"
    relations:
      - {type: maps_to, term_key: observation-band, note: "the band is the quantity the conditionality is predicated on; the term names a property OF a ranking, indexed to that band"}

  - term_key: crossover-band
    label: "Crossover band"
    canonical_form: "crossover band"
    definition: >-
      The band at which two systems exchange rank under a capacity benchmark. It is a joint property
      of the band and the delay horizon of the estimator rather than of the band alone, so a study
      reporting where an ordering flips must publish its horizon alongside its sample count.
    first_section: "Results - The crossover band is a joint property"
    relations:
      - {type: specializes, term_key: observation-band, note: "a crossover band IS a particular observation band -- the one at which two systems exchange rank -- so it specializes the band rather than the conditionality"}

  - term_key: readout-band-dissociation
    label: "Readout-band dissociation"
    canonical_form: "readout-band dissociation"
    definition: >-
      The result that a readout-band change moves memory functionals and leaves state-rank measures
      untouched, because rank measures under the ensemble protocol take one state per input stream
      and so cannot inherit the interval dependence of a delay functional. The dissociation is a
      property of the measure and its protocol rather than of any material, and it does not hold
      under the alternative protocol in which a single stream is sampled at every timepoint.
    first_section: "Results - A readout band destroys memory; A stylized account"
    relations:
      - {type: maps_to, term_key: readout-band, note: "the dissociation is a property of the readout arm specifically; a drive-band change moves every axis and produces no dissociation"}

  - term_key: architecture-family-variant
    label: "Architecture-family variant"
    canonical_form: "architecture-family variant"
    definition: >-
      One of several systems within a single architecture family differing in exactly one parameter,
      used as the unit of analysis in place of "substrate" where no materials claim is supported.
      Naming the unit this way is what keeps a demonstration on parameterised variants from being
      read as a comparison across materials. NOT a banned-form replacement for "substrate": that
      word is RESERVED, not retired, and remains correct where the paper names the interpretive
      target -- what a published SUBSTRATE ranking is conditional on -- and where it names the one
      physical system the design could not fairly rank. A `replaces:` entry here would flag those
      required uses and invite a later editor to delete them.
    first_section: "Method - The variants, and why they are not called substrates"

imports: []

refines: []
