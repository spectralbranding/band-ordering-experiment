limitations:
- description: Simulation only, and the single physical system is excluded from every ordering. The limit
    belongs on the first page rather than in a limitations section.
  severity: moderate
  addressable: true
- description: Everything ordered here differs in one parameter within one architecture family. The inference
    from that to a claim about substrates is an argument, made explicitly, and not a measurement.
  severity: moderate
  addressable: true
- description: 'The delay horizons swept are short by the field''s own conventions: a cutoff proportional
    to node count would set a far longer horizon than the sweep reaches, and the degree-2 basis makes
    the longer cutoff unaffordable at any budget this design can reach.'
  severity: moderate
  addressable: true
- description: The maximum degree of the capacity basis is fixed and unswept, carrying a bounded comparability
    cost against higher-degree measurements.
  severity: moderate
  addressable: true
- description: Ten seeds, t-based intervals, no multiplicity correction. The result is a fixed-effects
    statement about these six systems, not a population claim about architectures.
  severity: moderate
  addressable: true
- description: No mechanism is claimed for the readout arm; what replaces the withdrawn account is a description
    of a graded, thresholdless timescale mismatch.
  severity: moderate
  addressable: true
- description: 'The dissociation is conditional on the rank protocol, and the condition is now measured
    rather than assumed: under the single-stream protocol a readout-only band change moves generalisation
    rank substantially and kernel rank is at ceiling. P2 is false as a general claim about rank measures.
    What remains untested is whether the same protocol dependence holds on the oscillator-bank family.'
  severity: moderate
  addressable: true
- description: The reporting recommendation has not been tested against practice; whether adopting it
