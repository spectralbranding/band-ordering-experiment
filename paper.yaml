meta:
  title: Rank Order Under a Capacity Benchmark Is Conditional on the Observation Band and the Delay Horizon
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.22206844
  date: '2026-08-01'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - reservoir computing
  - benchmarking
  - information processing capacity
  - kernel rank
  - generalisation rank
  - measurement protocol
  - observation band
  - delay horizon
  - reporting standards
  - timescale matching.
  abstract: 'Reservoir-computing benchmarks increasingly report rank orderings, but rarely report the
    observation band or the delay horizon at which the ranking was taken. This note measures both conditions
    on a common grid. Under a readout-only change of band, the fastest system loses -6.61 information
    processing capacity [-6.89, -6.33] while its kernel rank moves -0.50 [-1.27, +0.27]: a readout band
    destroys memory and leaves separation intact, because rank measures, under the ensemble protocol,
    are computed from one state per input stream. That insulation belongs to the protocol and not to rank
    measures: under the field''s second protocol the same manipulation moves generalisation rank by fifteen
    points. Under a change of drive band the ordering reverses outright in 10 of 10 seeds, in two architecture
    families, and the band at which the crossover occurs moves with the delay horizon. The systems compared
    differ only in their time constant, so this is a demonstration of an effect the field already predicts,
    not a discovery; the contribution is the measurement on a common grid and the reporting condition
    that follows. The note recommends that any published ranking state its observation band, its delay
    horizon, and which behaviour-space axes were used under which protocol.'
