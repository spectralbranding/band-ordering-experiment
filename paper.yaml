  - P3
methodology:
  type: mixed
  design: 'Two-arm band sweep at fixed sample count: one arm decimates the readout at native drive, the
    other coarsens drive and readout together. Horizon sweep at two sample budgets, excluding cells that
    cannot feed the basis. Three-axis behaviour-space sweep across the same band grid, run separately
    on each architecture family.'
  analysis:
    software: band-ordering-experiment/code/band_ordering_study.py
    method: Python 3.12, inline dependency metadata, no setup
